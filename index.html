<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ZelenDa — микрозелень 🌱</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    /* Reset & base */
    :root{
      --bg: #f6f7f3;
      --surface: #ffffff;
      --muted: #6b6b6b;
      --text: #0f1720;
      --accent: #1f7a2b;      /* main green */
      --accent-weak: #e6f5ea;
      --accent-dark: #165a20;
      --danger: #c43a2c;
      --radius: 12px;
      --card-radius: 14px;
      --shadow: 0 8px 24px rgba(14, 40, 18, 0.06);
      --soft-shadow: 0 4px 12px rgba(14,40,18,0.04);
      --gap: 12px;
      --nav-height: 66px;
      --max-width: 640px;
      --ui-scale: 1; /* small adjustments if needed */
    }
    *{box-sizing:border-box}
    html,body{height:100%;margin:0;padding:0;background:var(--bg);font-family:"Inter",system-ui,Arial,"Helvetica Neue";-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;color:var(--text)}
    body{padding-bottom:calc(var(--nav-height) + 18px);display:flex;justify-content:center}
    .app{width:100%;max-width:var(--max-width);padding:14px;}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:48px;height:48px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(180deg,#eaf9ea,#e1f3df);box-shadow:var(--soft-shadow);font-weight:700;color:var(--accent-dark)
}
.title{font-size:16px;font-weight:700;margin:0}
.subtitle{font-size:12px;color:var(--muted);margin-top:2px}

/* Page */
.page{display:none}
.page.active{display:block}

/* Hero card */
.hero{background:var(--surface);border-radius:var(--card-radius);padding:12px;box-shadow:var(--shadow);display:flex;gap:12px;align-items:flex-start}
.hero-img{width:96px;height:76px;border-radius:10px;object-fit:cover;border:1px solid rgba(0,0,0,0.04)}
.hero-info h2{margin:0;font-size:15px}
.hero-info p{margin:8px 0 0 0;color:var(--muted);font-size:13px}
.hero-actions{display:flex;gap:10px;margin-top:10px}
.btn{border:0;padding:9px 12px;border-radius:10px;font-weight:700;cursor:pointer}
.btn-primary{background:linear-gradient(180deg,var(--accent),var(--accent-dark));color:#fff;box-shadow:0 6px 16px rgba(17,77,31,0.14)}
.btn-ghost{background:transparent;border:1px solid rgba(0,0,0,0.06);color:var(--text)}

/* Catalog list - compact */
.section-title{display:flex;justify-content:space-between;align-items:center;margin:14px 0 8px 0;font-weight:700}
.catalog{display:flex;flex-direction:column;gap:10px}
.card{display:flex;gap:12px;align-items:center;background:var(--surface);padding:10px;border-radius:12px;box-shadow:var(--soft-shadow);border:1px solid rgba(0,0,0,0.02)}
.thumb{width:78px;height:58px;border-radius:8px;object-fit:cover;border:1px solid rgba(0,0,0,0.04)}
.info{flex:1}
.name{font-size:14px;font-weight:700;margin:0}
.desc{font-size:12px;color:var(--muted);margin-top:6px}
.row{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
.price{font-weight:800}
.controls{display:flex;gap:8px;align-items:center}
.qty{min-width:36px;text-align:center;padding:6px 8px;border-radius:8px;background:#f6f6f5;font-weight:700}
.icon-btn{background:#f4f5f3;border-radius:8px;padding:8px;border:0;cursor:pointer}

/* Cart */
.cart-panel{background:var(--surface);border-radius:12px;padding:12px;box-shadow:var(--soft-shadow);margin-top:12px}
.cart-empty{color:var(--muted);padding:18px;text-align:center}
.cart-item{display:flex;gap:12px;align-items:center;padding:8px;border-radius:10px;background:#fff;border:1px solid rgba(0,0,0,0.02)}
.cart-mini{width:64px;height:46px;border-radius:8px;object-fit:cover}
.cart-meta{flex:1}
.cart-actions{display:flex;gap:8px;align-items:center}

/* Form */
.input{width:100%;padding:10px;border-radius:10px;border:1px solid #e9e9e8;margin-top:10px;font-size:14px}

/* bottom nav */
.bottom-nav{position:fixed;left:0;right:0;bottom:10px;display:flex;justify-content:center;pointer-events:none;width:100%}
.nav-inner{width:100%;max-width:var(--max-width);display:flex;gap:10px;padding:8px;box-sizing:border-box;pointer-events:auto}
.nav-item{flex:1;background:linear-gradient(180deg,#ffffff,#f7fff8);border-radius:14px;padding:10px 8px;display:flex;justify-content:center;align-items:center;gap:8px;cursor:pointer;border:1px solid rgba(0,0,0,0.03);font-weight:700}
.nav-badge{background:var(--accent);color:white;padding:2px 8px;border-radius:999px;font-weight:700;margin-left:6px;font-size:12px}

/* small animations */
.btn, .icon-btn, .nav-item{transition:transform .12s ease, box-shadow .12s ease}
.btn:active, .icon-btn:active, .nav-item:active{transform:translateY(1px)}
.card:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(14,40,18,0.08)}

/* responsive tweaks */
@media (max-width:420px){
  .hero-img{width:86px;height:68px}
  .logo{width:44px;height:44px}
  .nav-inner{padding:6px}
}
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="header" role="banner">
      <div class="brand">
        <div class="logo">ZD</div>
        <div>
          <div class="title">Микрозелень · ZelenDa</div>
          <div class="subtitle">Свежая микрозелень — доставка по Химкам</div>
        </div>
      </div>
      <div style="text-align:right">
        <div style="font-size:12px;color:var(--muted)">24/7</div>
        <div style="margin-top:6px;font-weight:700;color:var(--accent-dark)"><a href="https://t.me/Zakaz_Mikrozelen" target="_blank" style="color:inherit;text-decoration:none">@Zakaz_Mikrozelen</a></div>
      </div>
    </header>

    <!-- HOME -->
    <main id="home" class="page active" aria-live="polite">
      <section class="hero" aria-label="Акция">
        <img id="heroImage" class="hero-img" src="https://via.placeholder.com/300x200?text=%D0%90%D0%BA%D1%86%D0%B8%D1%8F" alt="Акция">
        <div class="hero-info">
          <h2>Набор «Свежие листья» — скидка 10%</h2>
          <p>Пробник 50–80 г • Бесплатная доставка по Левобережному району</p>
          <div class="hero-actions">
            <button id="btnCatalog" class="btn btn-primary" aria-label="Открыть каталог">Смотреть каталог</button>
            <button id="btnContact" class="btn btn-ghost" aria-label="Связаться">Связаться</button>
          </div>
        </div>
      </section>

      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:14px">
        <div class="section-title">Популярное</div>
        <div style="font-size:12px;color:var(--muted)">до 10 товаров</div>
      </div>

      <div id="catalog" class="catalog" aria-live="polite">
        <!-- product cards injected here -->
      </div>

      <div class="cart-panel" style="margin-top:16px">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div style="font-weight:800">Корзина</div>
          <div style="color:var(--muted);font-size:13px">Итого: <span id="total" style="font-weight:800">0 ₽</span></div>
        </div>
        <div id="cartArea" style="margin-top:10px">
          <div class="cart-empty" id="cartEmpty">Корзина пуста</div>
          <div id="cartList"></div>
        </div>

        <div style="margin-top:12px">
          <input id="inputName" class="input" type="text" placeholder="Ваше имя">
          <input id="inputPhone" class="input" type="tel" placeholder="Телефон (+7...)">
        </div>

        <div style="display:flex;gap:8px;margin-top:12px">
          <button id="btnOrder" class="btn btn-primary" style="flex:1">Оформить заказ</button>
          <button id="btnClear" class="btn btn-ghost">Очистить</button>
        </div>
        <div id="orderInfo" style="margin-top:8px;color:var(--muted);font-size:13px"></div>
      </div>
    </main>

    <!-- CATALOG page -->
    <section id="catalogPage" class="page" aria-live="polite">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div style="font-weight:800">Каталог</div>
        <div style="color:var(--muted);font-size:13px">10 товаров максимум</div>
      </div>
      <div id="catalogFull" style="margin-top:10px;display:flex;flex-direction:column;gap:10px"></div>
    </section>

  </div>

  <!-- bottom nav -->
  <div class="bottom-nav" role="navigation" aria-label="Навигация">
    <div class="nav-inner">
      <div id="navHome" class="nav-item" aria-label="Главная"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-right:6px"><path d="M3 11.5L12 4l9 7.5" stroke="#165A20" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>Главная</div>
      <div id="navCatalog" class="nav-item" aria-label="Каталог"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-right:6px"><rect x="3.5" y="4.5" width="17" height="15" rx="2" stroke="#165A20" stroke-width="1.4"/></svg>Каталог</div>
      <div id="navCart" class="nav-item" aria-label="Корзина"> <svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="margin-right:6px"><path d="M6 6h15l-1.4 8H8.4L6 6z" stroke="#165A20" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>Корзина <span id="badge" class="nav-badge" style="display:none">0</span></div>
    </div>
  </div>

<script>
(() => {
  const API_PRODUCTS = "https://zelen-da-backend.onrender.com/products/";
  const API_ORDERS = "https://zelen-da-backend.onrender.com/orders/";

  // Telegram init
  const tg = window.Telegram?.WebApp || null;
  let tgUser = { username: "unknown", id: null };
  let insideTelegram = false;
  try {
    if (tg) {
      insideTelegram = true;
      tg.expand?.();
      const u = tg.initDataUnsafe?.user || {};
      tgUser.username = u.username || (u.first_name ? (u.first_name + (u.last_name ? ' ' + u.last_name : '')) : 'unknown');
      tgUser.id = u.id || null;
    }
  } catch(e){ console.warn(e) }

  // State
  let products = [];
  let map = {};
  let cart = JSON.parse(localStorage.getItem('zelen_cart_v4') || '[]');

  // DOM refs
  const catalog = document.getElementById('catalog');
  const catalogFull = document.getElementById('catalogFull');
  const cartList = document.getElementById('cartList');
  const cartEmpty = document.getElementById('cartEmpty');
  const totalEl = document.getElementById('total');
  const badge = document.getElementById('badge');
  const orderInfo = document.getElementById('orderInfo');

  // navigation
  function show(pageId){
    document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
    document.getElementById(pageId).classList.add('active');
    window.scrollTo({top:0,behavior:'smooth'});
  }
  document.getElementById('navHome').addEventListener('click', ()=> show('home'));
  document.getElementById('navCatalog').addEventListener('click', ()=> show('catalogPage'));
  document.getElementById('navCart').addEventListener('click', ()=> show('home')); // we keep cart in home for compact flow; user can scroll

  document.getElementById('btnCatalog').addEventListener('click', ()=> show('catalogPage'));
  document.getElementById('btnContact').addEventListener('click', ()=> window.open('https://t.me/Zakaz_Mikrozelen','_blank'));

  // render product card (compact)
  function productCard(p){
    const wrap = document.createElement('div'); wrap.className='card';
    const img = document.createElement('img'); img.className='thumb'; img.src = p.image || 'https://via.placeholder.com/300x200?text=No+image'; img.alt = p.name;
    const info = document.createElement('div'); info.className='info';
    const name = document.createElement('div'); name.className='name'; name.textContent = p.name;
    const desc = document.createElement('div'); desc.className='desc'; desc.textContent = p.description || '';
    const row = document.createElement('div'); row.className='row';

    const price = document.createElement('div'); price.className='price'; price.textContent = (p.price || 0) + ' ₽';
    // controls
    const controls = document.createElement('div'); controls.className='controls';
    const dec = document.createElement('button'); dec.className='icon-btn'; dec.textContent='−';
    const qty = document.createElement('div'); qty.className='qty'; qty.textContent='1';
    const inc = document.createElement('button'); inc.className='icon-btn'; inc.textContent='+';
    const add = document.createElement('button'); add.className='btn btn-primary'; add.textContent='В корзину';

    let q = 1;
    dec.addEventListener('click', ()=> { if(q>1) q--; qty.textContent = q; });
    inc.addEventListener('click', ()=> { q++; qty.textContent = q; });
    add.addEventListener('click', ()=> { addToCart(p.id, q); q = 1; qty.textContent = '1'; showToast('Добавлено'); });

    controls.appendChild(dec); controls.appendChild(qty); controls.appendChild(inc);
    row.appendChild(price); row.appendChild(controls); row.appendChild(add);

    info.appendChild(name); info.appendChild(desc); info.appendChild(row);
    wrap.appendChild(img); wrap.appendChild(info);
    return wrap;
  }

  function renderCatalog(list, container){
    container.innerHTML = '';
    if(!list || !list.length){ container.innerHTML = '<div style="color:var(--muted)">Товары не найдены</div>'; return; }
    list.forEach(p=> container.appendChild(productCard(p)));
  }

  // cart operations
  function saveCart(){ localStorage.setItem('zelen_cart_v4', JSON.stringify(cart)); renderCart(); updateBadge(); }
  function addToCart(id, qty=1){
    qty = Math.max(1, Math.floor(qty));
    const found = cart.find(i=>i.id===id);
    if(found) found.qty += qty; else cart.push({id,qty});
    saveCart();
  }
  function renderCart(){
    cartList.innerHTML = '';
    if(!cart.length){ cartEmpty.style.display='block'; totalEl.textContent = '0 ₽'; return; }
    cartEmpty.style.display='none';
    let sum = 0;
    cart.forEach(item=>{
      const p = map[item.id] || { name: 'Товар', price:0, image:'' };
      const el = document.createElement('div'); el.className='cart-item';
      const img = document.createElement('img'); img.className='cart-mini'; img.src = p.image || 'https://via.placeholder.com/200';
      const meta = document.createElement('div'); meta.className='cart-meta';
      const n = document.createElement('div'); n.style.fontWeight='700'; n.textContent = p.name;
      const s = document.createElement('div'); s.style.color='var(--muted)'; s.textContent = `${item.qty} × ${p.price} ₽`;
      meta.appendChild(n); meta.appendChild(s);

      const actions = document.createElement('div'); actions.className='cart-actions';
      const plus = document.createElement('button'); plus.className='icon-btn'; plus.textContent='+';
      const minus = document.createElement('button'); minus.className='icon-btn'; minus.textContent='−';
      const remove = document.createElement('button'); remove.className='icon-btn'; remove.textContent='✕';

      plus.addEventListener('click', ()=> { item.qty++; saveCart(); });
      minus.addEventListener('click', ()=> { item.qty--; if(item.qty<=0) cart = cart.filter(x=>x.id!==item.id); saveCart(); });
      remove.addEventListener('click', ()=> { cart = cart.filter(x=>x.id!==item.id); saveCart(); });

      actions.appendChild(plus); actions.appendChild(minus); actions.appendChild(remove);

      el.appendChild(img); el.appendChild(meta); el.appendChild(actions);
      cartList.appendChild(el);
      sum += (p.price || 0) * item.qty;
    });
    totalEl.textContent = sum + ' ₽';
  }
  function updateBadge(){
    const total = cart.reduce((s,i)=>s + i.qty, 0);
    if(total>0){ badge.style.display='inline-block'; badge.textContent = total; } else badge.style.display='none';
  }

  // order
  async function placeOrder(){
    const name = document.getElementById('inputName').value.trim();
    const phone = document.getElementById('inputPhone').value.trim();
    if(!name || !phone){ alert('Укажите имя и телефон'); return; }
    if(!cart.length){ alert('Корзина пуста'); return; }

    const items = cart.map(i=>({ id:i.id, qty:i.qty, name: map[i.id]?.name || null, price: map[i.id]?.price || null }));
    const payload = { user_id: tgUser.id, username: tgUser.username, items, name, phone };

    const btn = document.getElementById('btnOrder');
    btn.disabled = true; btn.textContent = 'Отправка...';
    try {
      const res = await fetch(API_ORDERS, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      if(!res.ok) throw new Error('network');
      const data = await res.json();
      if(data.status === 'ok'){
        cart = []; saveCart();
        orderInfo.textContent = 'Заказ принят. Спасибо!';
        showToast('Заказ оформлен');
        if(insideTelegram && tg) { try { tg.sendData(JSON.stringify({type:'order_placed', order_id: data.order_id || null})); } catch(e){} }
      } else {
        throw new Error('server');
      }
    } catch(e){
      console.error(e);
      alert('Не удалось отправить заказ — попробуйте чуть позже');
    } finally {
      btn.disabled = false; btn.textContent = 'Оформить заказ';
    }
  }

  // small toast
  function showToast(text){
    const t = document.createElement('div'); t.style.position='fixed'; t.style.left='50%'; t.style.transform='translateX(-50%)'; t.style.bottom='110px'; t.style.background='rgba(0,0,0,0.8)'; t.style.color='#fff'; t.style.padding='8px 12px'; t.style.borderRadius='12px'; t.style.zIndex=9999; t.textContent = text;
    document.body.appendChild(t); setTimeout(()=> t.remove(),1200);
  }

  // load products
  async function load(){
    catalog.innerHTML = '<div style="color:var(--muted)">Загрузка…</div>';
    catalogFull.innerHTML = '';
    try {
      const r = await fetch(API_PRODUCTS);
      if(!r.ok) throw new Error('fetch');
      const data = await r.json();
      products = data;
      map = {}; products.forEach(p=> map[p.id]=p);
      // render popular (first 6)
      catalog.innerHTML = '';
      products.slice(0,6).forEach(p=> catalog.appendChild(productCard(p)));
      // full catalog
      products.forEach(p=> catalogFull.appendChild(productCard(p)));
      // hero image
      if(products[0] && products[0].image) document.getElementById('heroImage').src = products[0].image;
    } catch(e){
      catalog.innerHTML = '<div style="color:var(--muted)">Не удалось загрузить товары</div>';
      console.error(e);
    }
    renderCart();
    updateBadge();
  }

  // wire UI
  document.getElementById('btnOrder').addEventListener('click', placeOrder);
  document.getElementById('btnClear').addEventListener('click', ()=> { if(confirm('Очистить корзину?')){ cart=[]; saveCart(); showToast('Очистили'); }});
  document.getElementById('navHome').addEventListener('click', ()=> show('home'));
  document.getElementById('navCatalog').addEventListener('click', ()=> show('catalogPage'));
  document.getElementById('navCart').addEventListener('click', ()=> { window.scrollTo({top:document.querySelector('.cart-panel').offsetTop - 10, behavior:'smooth'}); });

  // startup
  load();
  renderCart();
  updateBadge();

  // expose debugging
  window.zelen = { cart, products, map, addToCart };
})();
</script>
</body>
</html>
