<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ZelenDa — микрозелень 🌱</title>

  <!-- Лёгкий читаемый шрифт -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

  <!-- Telegram Web App SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    :root{
      --bg: #fbfcfa;
      --card: #ffffff;
      --muted: #6e6e6e;
      --accent: #2e7d32;        /* зелёный основной */
      --accent-2: #7b2e2e;      /* рубиновый акцент */
      --radius: 10px;
      --shadow: 0 6px 18px rgba(17,17,17,0.06);
      --gap: 10px;
      --nav-height: 64px;
      --max-width: 540px;
    }
    html,body{height:100%; margin:0; padding:0; background:var(--bg); font-family:"Inter",system-ui,Arial; -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;}
    body{padding-bottom:calc(var(--nav-height) + 18px);} /* space for bottom nav */
    .app{max-width:var(--max-width); margin:0 auto; padding:12px;}

    /* Header */
    header.app-header{ display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px; }
    .brand { display:flex; gap:10px; align-items:center; }
    .logo{
      width:44px; height:44px; border-radius:9px; display:flex; align-items:center; justify-content:center;
      background:linear-gradient(135deg,#eaf6ea,#e1f3df); color:var(--accent-2); font-weight:700; box-shadow:0 6px 14px rgba(30,80,30,0.06);
      border:1px solid rgba(0,0,0,0.03);
      font-size:15px;
    }
    .title { font-size:16px; margin:0; font-weight:700; line-height:1; }
    .subtitle { font-size:12px; color:var(--muted); margin-top:2px; }

    /* Page containers */
    .page { display:none; }
    .page.active { display:block; }

    /* Hero compact */
    .hero-card {
      background:var(--card); border-radius:var(--radius); padding:10px; box-shadow:var(--shadow);
      display:flex; gap:10px; align-items:flex-start;
    }
    .hero-thumb{ width:92px; height:72px; border-radius:8px; object-fit:cover; flex:0 0 92px; border:1px solid rgba(0,0,0,0.04); }
    .hero-meta h2{ margin:0; font-size:15px; }
    .hero-meta p{ margin:6px 0 0 0; font-size:12px; color:var(--muted); }

    /* Compact product list (single column) */
    .catalog { margin-top:10px; display:flex; flex-direction:column; gap:10px; }
    .product {
      display:flex; gap:10px; align-items:center; background:var(--card); border-radius:10px; padding:10px; box-shadow:var(--shadow);
    }
    .product .img { width:74px; height:56px; border-radius:8px; object-fit:cover; flex:0 0 74px; border:1px solid rgba(0,0,0,0.04); }
    .product .info { flex:1; }
    .product h4{ margin:0; font-size:14px; }
    .product .desc{ margin-top:4px; font-size:12px; color:var(--muted); }
    .product .bottom { margin-top:8px; display:flex; align-items:center; gap:8px; justify-content:space-between; }
    .price { font-weight:700; font-size:14px; color:#111; }
    .controls { display:flex; gap:8px; align-items:center; }
    .qty { min-width:34px; padding:6px 8px; text-align:center; border-radius:8px; background:#f4f4f2; font-weight:600; }
    .small-btn { background:#f1f1f0; border-radius:8px; padding:6px 8px; border:none; font-weight:700; cursor:pointer; }

    .add-to-cart {
      background:var(--accent); color:white; border:none; padding:8px 10px; border-radius:8px; font-weight:700; cursor:pointer;
    }

    /* Cart page */
    .cart-card { margin-top:10px; background:var(--card); border-radius:12px; padding:10px; box-shadow:var(--shadow); }
    .cart-empty { color:var(--muted); padding:16px 8px; text-align:center; }

    .cart-item { display:flex; gap:10px; align-items:center; padding:8px; border-radius:10px; border:1px solid rgba(0,0,0,0.03); background:white; }
    .cart-item .mini { width:60px; height:44px; border-radius:8px; object-fit:cover; flex:0 0 60px; }
    .cart-item .info { flex:1; }
    .cart-total { display:flex; justify-content:space-between; align-items:center; padding-top:10px; font-weight:700; }

    /* Form controls */
    input[type="text"], input[type="tel"] {
      width:100%; padding:10px; border-radius:8px; border:1px solid #e6e6e5; margin-top:8px; box-sizing:border-box;
      font-size:14px;
    }

    /* Bottom nav (fixed) */
    .bottom-nav {
      position:fixed; left:0; right:0; bottom:8px; display:flex; justify-content:center; pointer-events:none; z-index:1200;
    }
    .nav-row {
      width:100%; max-width:var(--max-width); display:flex; gap:8px; padding:8px; box-sizing:border-box; pointer-events:auto;
    }
    .nav-btn {
      flex:1; background:linear-gradient(180deg, #fff 0%, #f6fff7 100%); border-radius:12px; padding:10px 8px;
      box-shadow:0 8px 18px rgba(20,20,20,0.06); border:1px solid rgba(0,0,0,0.04); display:flex; gap:8px; align-items:center; justify-content:center; cursor:pointer; font-weight:700; font-size:13px;
    }

    .nav-badge { background:var(--accent-2); color:white; padding:3px 8px; border-radius:10px; font-size:12px; margin-left:6px; }

    /* Toast */
    .toast { position:fixed; left:50%; transform:translateX(-50%); bottom:92px; background:rgba(0,0,0,0.85); color:white; padding:8px 12px; border-radius:12px; font-size:13px; z-index:1300; }

    /* Very small screens adjust */
    @media (max-height:600px){
      body{ padding-bottom:calc(var(--nav-height) + 8px); }
      .nav-btn { padding:8px 6px; font-size:12px; }
    }
    @media (min-width:520px){
      .app{ padding:16px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app">
    <header class="app-header" role="banner">
      <div class="brand">
        <div class="logo">ZD</div>
        <div>
          <div class="title">Микрозелень • ZelenDa</div>
          <div class="subtitle">Свежая микрозелень — доставка по Химкам</div>
        </div>
      </div>
      <div style="text-align:right;font-size:12px;color:var(--muted)">
        <div>24/7</div>
        <div style="margin-top:4px"><a href="https://t.me/Zakaz_Mikrozelen" target="_blank" style="color:var(--accent-2); text-decoration:none; font-weight:700">@Zakaz_Mikrozelen</a></div>
      </div>
    </header>

    <!-- HOME -->
    <main id="home" class="page active" aria-labelledby="home-title">
      <div class="hero-card" role="region" aria-label="Акция">
        <img id="heroImage" class="hero-thumb" src="https://via.placeholder.com/300x200?text=%D0%90%D0%BA%D1%86%D0%B8%D1%8F" alt="Акция" />
        <div class="hero-meta">
          <h2 id="home-title" style="font-size:15px;margin:0">Набор «Свежие листья» — Скидка 10%</h2>
          <p style="margin:6px 0 0 0">Идеально для салатов — пробник 50–80 г. Бесплатная доставка по Левобережному району.</p>
          <div style="display:flex; gap:8px; margin-top:10px;">
            <button id="openCatalogBtn" class="add-to-cart" style="padding:8px 10px; font-size:14px">Смотреть каталог</button>
            <button id="contactBtn" class="small-btn" style="padding:8px 10px; font-size:14px">Связаться</button>
          </div>
        </div>
      </div>

      <section style="margin-top:10px">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px">
          <div style="font-weight:700">Популярное</div>
          <div style="font-size:12px;color:var(--muted)">10 товаров максимум</div>
        </div>
        <div id="catalogList" class="catalog" aria-live="polite"></div>
      </section>
    </main>

    <!-- CATALOG page -->
    <section id="catalog" class="page" aria-labelledby="catalog-title">
      <h3 id="catalog-title" style="margin:6px 0 6px 0">Каталог</h3>
      <div id="catalogFull" class="catalog"></div>
    </section>

    <!-- CART page -->
    <section id="cart" class="page" aria-labelledby="cart-title">
      <h3 id="cart-title" style="margin:6px 0 6px 0">Корзина</h3>
      <div class="cart-card">
        <div id="cartItems"></div>
        <div id="cartEmpty" class="cart-empty">Корзина пуста</div>
        <div class="cart-total" style="margin-top:10px">
          <div>Итого</div>
          <div id="cartSum">0 ₽</div>
        </div>

        <div style="margin-top:10px">
          <input id="inputName" type="text" placeholder="Ваше имя" />
          <input id="inputPhone" type="tel" placeholder="Телефон (+7...)" />
        </div>

        <div style="display:flex; gap:8px; margin-top:10px">
          <button id="placeOrder" class="add-to-cart" style="flex:1">Оформить</button>
          <button id="clearCart" class="small-btn" style="flex:0 0 110px">Очистить</button>
        </div>
        <div id="orderMsg" style="margin-top:8px; font-size:13px; color:var(--muted)"></div>
      </div>
    </section>

  </div>

  <!-- bottom navigation -->
  <nav class="bottom-nav" role="navigation" aria-label="Навигация">
    <div class="nav-row">
      <button id="navHome" class="nav-btn" aria-label="Главная">🏠<span style="margin-left:8px">Главная</span></button>
      <button id="navCatalogBtn" class="nav-btn" aria-label="Каталог">🛍<span style="margin-left:8px">Каталог</span></button>
      <button id="navCartBtn" class="nav-btn" aria-label="Корзина">🛒 Корзина <span id="cartBadge" class="nav-badge" style="display:none">0</span></button>
    </div>
  </nav>

  <script>
  (function(){
    // Config
    const API_PRODUCTS = "https://zelen-da-backend.onrender.com/products/";
    const API_ORDERS = "https://zelen-da-backend.onrender.com/orders/";

    // Telegram init
    const tg = window.Telegram?.WebApp || null;
    let tgUser = { username: "unknown", id: null };
    let openedInTelegram = false;
    try {
      if (tg) {
        openedInTelegram = true;
        tg.expand?.();
        const u = tg.initDataUnsafe?.user || {};
        tgUser.username = u.username || (u.first_name ? (u.first_name + (u.last_name ? " " + u.last_name : "")) : "unknown");
        tgUser.id = u.id || null;
      }
    } catch(e){ console.warn("TG init error", e) }

    // State
    let products = [];
    let productsMap = {};
    let cart = JSON.parse(localStorage.getItem("zelen_cart_v3") || "[]");

    // Utils
    function saveCart(){ localStorage.setItem("zelen_cart_v3", JSON.stringify(cart)); renderCart(); updateBadge(); }
    function updateBadge(){
      const total = cart.reduce((s,i)=>s+i.qty,0);
      const badge = document.getElementById("cartBadge");
      if (total>0){ badge.style.display='inline-block'; badge.textContent = total; } else badge.style.display='none';
    }
    function formatPrice(n){ return (n || 0) + " ₽"; }

    function el(tag, props={}, children=[]){
      const d = document.createElement(tag);
      for (const k in props) { if (k === 'class') d.className = props[k]; else if (k === 'html') d.innerHTML = props[k]; else d.setAttribute(k, props[k]); }
      (Array.isArray(children) ? children : [children]).forEach(c=>{ if (!c) return; if (typeof c === 'string') d.appendChild(document.createTextNode(c)); else d.appendChild(c); });
      return d;
    }

    // Render product compact card
    function createProductCard(p){
      const card = el('div',{class:'product'});
      const img = el('img',{class:'img', src: p.image || 'https://via.placeholder.com/300x200?text=No+image', alt: p.name});
      const info = el('div',{class:'info'});
      const title = el('h4',{}, p.name);
      const desc = el('div',{class:'desc'}, p.description || '');
      const bottom = el('div',{class:'bottom'});

      const price = el('div',{class:'price'}, formatPrice(p.price));
      const controls = el('div',{class:'controls'});

      const dec = el('button',{class:'small-btn', 'aria-label':'уменьшить'} , '−');
      const qty = el('div',{class:'qty'}, '1');
      const inc = el('button',{class:'small-btn', 'aria-label':'увеличить'}, '+');

      let localQty = 1;
      dec.addEventListener('click', ()=> { if (localQty>1) localQty--; qty.textContent = localQty; });
      inc.addEventListener('click', ()=> { localQty++; qty.textContent = localQty; });

      const add = el('button',{class:'add-to-cart'}, 'В корзину');
      add.addEventListener('click', ()=> {
        addToCart(p.id, localQty);
        localQty = 1; qty.textContent = '1';
        showToast('Добавлено в корзину');
      });

      controls.appendChild(dec); controls.appendChild(qty); controls.appendChild(inc);

      bottom.appendChild(price); bottom.appendChild(controls); bottom.appendChild(add);

      info.appendChild(title); info.appendChild(desc); info.appendChild(bottom);

      card.appendChild(img); card.appendChild(info);
      return card;
    }

    // Load products
    async function loadProducts(){
      const listEl = document.getElementById('catalogList');
      const fullEl = document.getElementById('catalogFull');
      listEl.innerHTML = '<div class="cart-empty">Загрузка…</div>';
      fullEl.innerHTML = '';
      try {
        const res = await fetch(API_PRODUCTS);
        if (!res.ok) throw new Error('fetch error');
        products = await res.json();
        productsMap = {};
        products.forEach(p=> productsMap[p.id] = p);
        // fill popular (first 4)
        listEl.innerHTML = '';
        products.slice(0,6).forEach(p => listEl.appendChild(createProductCard(p)));
        // full catalog
        products.forEach(p => fullEl.appendChild(createProductCard(p)));
        // hero image (first product)
        if (products[0] && products[0].image) document.getElementById('heroImage').src = products[0].image;
      } catch(e){
        listEl.innerHTML = '<div class="cart-empty">Не удалось загрузить товары.</div>';
        console.error(e);
      }
      renderCart();
      updateBadge();
    }

    // Cart operations
    function addToCart(id, qty){
      qty = Math.max(1, Number(qty||1));
      const found = cart.find(i=>i.id===id);
      if (found) found.qty += qty; else cart.push({id:id, qty:qty});
      saveCart();
    }
    function renderCart(){
      const itemsEl = document.getElementById('cartItems');
      const emptyEl = document.getElementById('cartEmpty');
      itemsEl.innerHTML = '';
      if (!cart || cart.length===0){ emptyEl.style.display='block'; document.getElementById('cartSum').textContent = formatPrice(0); return; }
      emptyEl.style.display='none';
      cart.forEach(it=>{
        const p = productsMap[it.id] || { name: 'Товар', price:0, image:'' };
        const item = el('div',{class:'cart-item'});
        const img = el('img',{class:'mini', src: p.image || 'https://via.placeholder.com/200'});
        const info = el('div',{class:'info'});
        const title = el('div',{}, p.name);
        const small = el('div',{class:'muted'}, `${it.qty} × ${formatPrice(p.price)}`);
        info.appendChild(title); info.appendChild(small);

        const actions = el('div',{style:'display:flex;flex-direction:column;gap:6px;align-items:flex-end'});
        const inc = el('button',{class:'small-btn'}, '+');
        const dec = el('button',{class:'small-btn'}, '−');
        const rm = el('button',{class:'small-btn'}, 'Удалить');
        inc.addEventListener('click', ()=> { it.qty++; saveCart(); });
        dec.addEventListener('click', ()=> { it.qty--; if (it.qty<=0) cart = cart.filter(x=>x.id!==it.id); saveCart(); });
        rm.addEventListener('click', ()=> { cart = cart.filter(x=>x.id!==it.id); saveCart(); });
        actions.appendChild(inc); actions.appendChild(dec); actions.appendChild(rm);

        item.appendChild(img); item.appendChild(info); item.appendChild(actions);
        itemsEl.appendChild(item);
      });
      const total = cart.reduce((s,it)=> s + ( (productsMap[it.id] ? productsMap[it.id].price : 0) * it.qty ), 0);
      document.getElementById('cartSum').textContent = formatPrice(total);
    }

    // Place order
    async function placeOrder(){
      const name = document.getElementById('inputName').value.trim();
      const phone = document.getElementById('inputPhone').value.trim();
      if (!name || !phone){ alert('Укажите имя и телефон'); return; }
      if (!cart || cart.length===0){ alert('Корзина пуста'); return; }

      const items = cart.map(it=> ({ id: it.id, qty: it.qty, name: productsMap[it.id]?.name || null, price: productsMap[it.id]?.price || null }) );
      const payload = { user_id: tgUser.id, username: tgUser.username, items, name, phone };

      const btn = document.getElementById('placeOrder');
      btn.disabled = true; btn.textContent = 'Отправка...';
      try {
        const res = await fetch(API_ORDERS, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
        if (!res.ok) throw new Error('http ' + res.status);
        const data = await res.json();
        if (data.status === 'ok') {
          cart = []; saveCart();
          document.getElementById('orderMsg').textContent = 'Заказ принят. Спасибо!';
          showToast('Заказ принят');
          // send data to Telegram if inside
          if (openedInTelegram && tg) {
            try { tg.sendData(JSON.stringify({ type:'order_placed', order_id:data.order_id || null })); } catch(e){}
          }
        } else {
          throw new Error('server error');
        }
      } catch(e){
        console.error(e);
        alert('Не удалось отправить заказ — попробуйте позже');
      } finally {
        btn.disabled = false; btn.textContent = 'Оформить';
      }
    }

    // UI helpers
    function showToast(text){
      const t = document.createElement('div'); t.className='toast'; t.textContent = text;
      document.body.appendChild(t);
      setTimeout(()=> { t.remove(); }, 1500);
    }

    // Nav
    function showPage(name){
      document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
      document.getElementById(name).classList.add('active');
    }

    // Wire events
    document.getElementById('openCatalogBtn').addEventListener('click', ()=> { showPage('catalog'); });
    document.getElementById('contactBtn').addEventListener('click', ()=> { window.open('https://t.me/Zakaz_Mikrozelen','_blank'); });
    document.getElementById('navHome').addEventListener('click', ()=> showPage('home'));
    document.getElementById('navCatalogBtn').addEventListener('click', ()=> showPage('catalog'));
    document.getElementById('navCartBtn').addEventListener('click', ()=> showPage('cart'));
    document.getElementById('placeOrder').addEventListener('click', placeOrder);
    document.getElementById('clearCart').addEventListener('click', ()=> { if(confirm('Очистить корзину?')){ cart=[]; saveCart(); showToast('Корзина очищена'); }});

    // Boot
    loadProducts();
    updateBadge();

    // Open specific page from hash
    if (location.hash){
      if (location.hash.includes('catalog')) showPage('catalog');
      if (location.hash.includes('cart')) showPage('cart');
    }

    // expose for debug
    window.zelenApp = { addToCart, cart, products };
  })();
  </script>
</body>
</html>
